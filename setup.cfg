[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[metadata]
name = oams
version = 1.0.0
description = OpenAgent Memory Standard - AI agent memory migration
author = OpenAgent Community
license = MIT
license_files = LICENSE

[options]
packages = find:
package_dir = =src
python_requires = >=3.8
install_requires =
    pydantic>=2.0.0
    click>=8.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    oams = oams.cli:main
